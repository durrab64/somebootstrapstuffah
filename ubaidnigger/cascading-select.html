<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 04: Cascading Dropdowns</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to System Terminal</a>

    <header>
      <h1>Subsystem Configurator</h1>
      <p>Module_04: Linked Inputs &amp; Cascading Options Rebuilding</p>
    </header>

    <div class="edu-box">
      <strong>[DOCUMENTATION]:</strong>
      Binds change events on primary inputs. Queries secondary models from <code>/get-models?make=value</code> and populates option vectors dynamically.
    </div>

    <div class="card" style="max-width: 550px; margin: 0 auto;">
      <h2 class="card-title" style="margin-bottom: 1.5rem;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5H21A7.5 7.5 0 0013.5 3v7.5z" />
        </svg>
        Drone Specifications
      </h2>

      <!-- Make Selection -->
      <div class="form-group">
        <label class="form-label" for="make-select">Manufacturer (Make)</label>
        <select id="make-select">
          <option value="">-- Select Maker --</option>
          <option value="toyota">Toyota Cyber-Tech</option>
          <option value="ford">Ford Heavy Ind.</option>
          <option value="honda">Honda Robotics</option>
          <option value="tesla">Tesla Neural</option>
          <option value="bmw">BMW AeroSpace</option>
        </select>
      </div>

      <!-- Model Selection -->
      <div class="form-group">
        <label class="form-label" for="model-select">Chassis Line (Model)</label>
        <select id="model-select" disabled>
          <option value="">-- Awaiting Manufacturer Signal --</option>
        </select>
      </div>

      <!-- Result Summary -->
      <div id="selection-summary" style="display: none; padding: 0.75rem 1rem; background: rgba(0, 240, 255, 0.1); border: 1px dashed var(--neon-cyan); border-radius: var(--radius); font-size: 0.95rem; text-align: center; color: var(--neon-cyan);">
      </div>
    </div>
  </div>

  <script src="mock-api.js"></script>
  <script>
    const makeSelect = document.getElementById('make-select');
    const modelSelect = document.getElementById('model-select');
    const selectionSummary = document.getElementById('selection-summary');

    makeSelect.addEventListener('change', () => {
      const selectedMake = makeSelect.value;

      if (selectedMake === '') {
        resetModelDropdown('-- Awaiting Manufacturer Signal --');
        updateSummary();
        return;
      }

      resetModelDropdown('Receiving remote telemetry...');
      modelSelect.disabled = true;

      fetch(`/get-models?make=${encodeURIComponent(selectedMake)}`)
        .then(response => {
          if (!response.ok) throw new Error('Telemetry corrupted');
          return response.json();
        })
        .then(models => {
          modelSelect.innerHTML = '<option value="">-- Choose Model --</option>';
          
          models.forEach(model => {
            const option = document.createElement('option');
            option.value = model.toLowerCase().replace(/\s+/g, '-');
            option.textContent = model;
            modelSelect.appendChild(option);
          });

          modelSelect.disabled = false;
          updateSummary();
        })
        .catch(error => {
          console.error("AJAX Error:", error);
          resetModelDropdown('⚠️ Telemetry error');
          updateSummary();
        });
    });

    modelSelect.addEventListener('change', updateSummary);

    function resetModelDropdown(placeholderText) {
      modelSelect.innerHTML = `<option value="">-- ${placeholderText} --</option>`;
      modelSelect.disabled = true;
    }

    function updateSummary() {
      if (makeSelect.value && modelSelect.value) {
        const makeText = makeSelect.options[makeSelect.selectedIndex].text;
        const modelText = modelSelect.options[modelSelect.selectedIndex].text;
        selectionSummary.innerHTML = `SYSTEM CONFIG: [${makeText.toUpperCase()} // ${modelText.toUpperCase()}] ACTIVE`;
        selectionSummary.style.display = 'block';
      } else {
        selectionSummary.style.display = 'none';
      }
    }
  </script>
</body>
</html>
